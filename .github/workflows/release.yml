name: Release

# Два способа выпустить релиз:
# 1) push тега v0.2.0 — версия берётся из тега; тег с суффиксом (v0.2.0-rc.1) даёт пререлиз;
# 2) ручной запуск (Actions → Release → Run workflow) с версией 0.2.0 — workflow сам
#    прогонит тесты, соберёт APK, поставит тег v0.2.0 и опубликует релиз; версия с суффиксом
#    (0.2.0-rc.1) публикуется как пререлиз.
# Порядок в обоих случаях один: сначала тесты, затем сборка, только потом публикация.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без префикса v: 0.2.0 или пререлиз 0.2.0-rc.1'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Тесты, сборка и публикация
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Полная история: ручной запуск ставит тег на текущий коммит ветки.
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Ставим через sdkmanager самого раннера: android-actions/setup-android падает
      # на установке пакета tools, которого нет в новых cmdline-tools.
      - name: Пакеты Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Юнит-тесты
        run: >
          ./gradlew --no-daemon --console=plain
          :core:data:testDebugUnitTest
          :core:playlist:testDebugUnitTest
          :app:testDebugUnitTest

      - name: Версия и тег
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            value="$INPUT_VERSION"
          else
            value="${REF_NAME#v}"
          fi
          # X.Y.Z или пререлиз X.Y.Z-суффикс: суффикс делает релиз пререлизом.
          if ! printf '%s' "$value" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Версия должна быть вида 0.2.0 или 0.2.0-rc.1, получено: $value" >&2
            exit 1
          fi
          prerelease=false
          case "$value" in
            *-*) prerelease=true ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "tag=v$value" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Версия: $value, тег: v$value, пререлиз: $prerelease"

      # Ручной запуск ставит тег сам. Тег, созданный GITHUB_TOKEN, не запускает
      # workflow повторно, поэтому рекурсии нет.
      - name: Тег при ручном запуске
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "workflow_dispatch" ]; then
            echo "Релиз по тегу: тег уже существует"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже существует — выбери другую версию" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Смотришка ТВ ${{ steps.version.outputs.value }}"
          git push origin "refs/tags/$TAG"

      # Ключ релиза приходит секретом GitHub и живёт только в раннере.
      - name: Распаковать ключ релиза
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: Сборка release и debug
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.value }}
          VERSION_CODE: ${{ github.run_number }}
        run: >
          ./gradlew --no-daemon --console=plain
          :app:assembleRelease
          :app:assembleDebug

      - name: Имена ассетов
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/smotrishka_${version}.release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/smotrishka_${version}.debug.apk"
          ls -l dist

      # gh уже стоит на раннере: релиз публикуется штатным CLI, без сторонних экшенов
      # (у softprops/action-gh-release@v3 изменился интерфейс — tag_name и generate_release_notes убраны).
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(
            "dist/smotrishka_${VERSION}.release.apk"
            "dist/smotrishka_${VERSION}.debug.apk"
          )
          # Релиз для тега мог быть создан до прогона (руками или в прошлом ретрае):
          # gh release create в этом случае падает, и оба APK не публикуются.
          # Поэтому существующий релиз не пересоздаём, а перезаписываем ассеты.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиз $TAG уже существует — перезаписываю ассеты"
            gh release upload "$TAG" "${assets[@]}" --clobber
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --prerelease
            else
              gh release edit "$TAG" --prerelease=false
            fi
          else
            args=(--title "Смотришка ТВ $VERSION" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${assets[@]}" "${args[@]}"
          fi
