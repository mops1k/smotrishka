name: Release

# Два способа выпустить релиз:
# 1) push тега v0.2.0 — версия берётся из тега;
# 2) ручной запуск (Actions → Release → Run workflow) с версией 0.2.0 — workflow сам
#    прогонит тесты, соберёт APK, поставит тег v0.2.0 и опубликует релиз.
# Порядок в обоих случаях один: сначала тесты, затем сборка, только потом публикация.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без префикса v, например 0.2.0'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Тесты, сборка и публикация
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история: ручной запуск ставит тег на текущий коммит ветки.
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Пакеты Android SDK
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Юнит-тесты
        run: >
          ./gradlew --no-daemon --console=plain
          :core:data:testDebugUnitTest
          :core:playlist:testDebugUnitTest
          :app:testDebugUnitTest

      - name: Версия и тег
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            value="$INPUT_VERSION"
            if ! printf '%s' "$value" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Версия должна быть в формате X.Y.Z, получено: $value" >&2
              exit 1
            fi
          else
            value="${REF_NAME#v}"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "tag=v$value" >> "$GITHUB_OUTPUT"
          echo "Версия: $value, тег: v$value"

      # Ручной запуск ставит тег сам. Тег, созданный GITHUB_TOKEN, не запускает
      # workflow повторно, поэтому рекурсии нет.
      - name: Тег при ручном запуске
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "workflow_dispatch" ]; then
            echo "Релиз по тегу: тег уже существует"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже существует — выбери другую версию" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Смотришка ТВ ${{ steps.version.outputs.value }}"
          git push origin "refs/tags/$TAG"

      # Ключ релиза приходит секретом GitHub и живёт только в раннере.
      - name: Распаковать ключ релиза
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: Сборка release и debug
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.value }}
          VERSION_CODE: ${{ github.run_number }}
        run: >
          ./gradlew --no-daemon --console=plain
          :app:assembleRelease
          :app:assembleDebug

      - name: Имена ассетов
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/smotrishka_${version}.release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/smotrishka_${version}.debug.apk"
          ls -l dist

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          name: Смотришка ТВ ${{ steps.version.outputs.value }}
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/smotrishka_${{ steps.version.outputs.value }}.release.apk
            dist/smotrishka_${{ steps.version.outputs.value }}.debug.apk
