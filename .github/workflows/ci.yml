name: CI

# Тесты на каждый pull request и на push в master.
# Сборка запускается только после зелёных тестов — падение тестов останавливает job.
on:
  pull_request:
  push:
    branches: [master]

# Новый коммит в ту же ветку отменяет прошлый прогон: незачем держать два.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Тесты и сборка debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # compileSdk 37 (Android 17) и build-tools 36: те же версии, что на машине разработчика.
      # Ставим через sdkmanager самого раннера: android-actions/setup-android падает
      # на установке пакета tools, которого нет в новых cmdline-tools.
      - name: Пакеты Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Юнит-тесты
        run: >
          ./gradlew --no-daemon --console=plain
          :core:data:testDebugUnitTest
          :core:playlist:testDebugUnitTest
          :app:testDebugUnitTest

      - name: Сборка debug APK
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Артефакт debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
